[bastion]
bastion-host ansible_host=51.250.89.49 ansible_user=ubuntu ansible_ssh_private_key_file=/home/admin/.ssh/diplom_cloud ansible_ssh_common_args='-o StrictHostKeyChecking=no -o IdentitiesOnly=yes'

[master]
k8s-master ansible_host=10.50.0.4

[workers]
k8s-worker-1 ansible_host=10.50.1.22
k8s-worker-2 ansible_host=10.50.2.24

[k8s_cluster:children]
master
workers

[master:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=/home/admin/.ssh/diplom_cloud
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ProxyJump=bastion'

[workers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=/home/admin/.ssh/diplom_cloud
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ProxyJump=bastion'
