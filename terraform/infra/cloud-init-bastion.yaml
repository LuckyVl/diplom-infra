#cloud-config
package_update: true
package_upgrade: true
packages:
  - python3
  - python3-pip
  - jq
  - curl
  - wget
  - git
  - net-tools

write_files:
  - path: /etc/sysctl.d/99-bastion.conf
    content: |
      net.ipv4.ip_forward = 1
    permissions: '0644'

runcmd:
  - sysctl -p /etc/sysctl.d/99-bastion.conf
  - echo "Bastion host is ready!" > /var/log/cloud-init-done.log